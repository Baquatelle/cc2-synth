name: docs

on:
  push:
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check_docs.py"

jobs:
  check-doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local Markdown links resolve
        run: python3 scripts/check_docs.py
